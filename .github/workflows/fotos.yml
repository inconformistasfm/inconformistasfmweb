   name: Actualizar fotos

   on:
     push:
       branches: [main, master]
       paths:
         - 'fotos-programas/**'
         - 'galeria/**'
         - 'scripts/generar-fotos.mjs'
     workflow_dispatch:

   permissions:
     contents: write

   concurrency:
     group: fotos
     cancel-in-progress: false

   jobs:
     fotos:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 20
         - run: npm install --no-save sharp
         - run: node scripts/generar-fotos.mjs
         - name: Guardar cambios
           run: |
             git config user.name "github-actions[bot]"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             git add fotos.json optimizadas
             if ! git diff --cached --quiet; then
               git commit -m "Actualizar fotos automáticamente"
               git pull --rebase
               git push
             fi

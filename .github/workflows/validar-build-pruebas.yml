name: Validar build de Inconformistas FM (solo pruebas)

on:
  push:
    branches:
      - pruebas/accesibilidad-seo-rendimiento

permissions:
  contents: read

concurrency:
  group: validar-inconformistas-pruebas
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/pruebas/accesibilidad-seo-rendimiento'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar exclusivamente la rama de pruebas
        uses: actions/checkout@v4
        with:
          ref: refs/heads/pruebas/accesibilidad-seo-rendimiento
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas y recursos
        run: node generar-galeria.js

      - name: Validar SEO, accesibilidad básica, rutas y recursos
        run: node scripts/verificar-build.js

      - name: Comprobar sintaxis de todo el JavaScript generado
        run: |
          find assets/generated/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Resumen de tamaños
        run: |
          echo "Tamaño de las páginas HTML generadas:"
          wc -c index.html programas.html noticias.html equipo.html galeria.html artistas.html radio-online.html contacto.html
          echo "Tamaño total de recursos generados:"
          du -sh assets/generated

      - name: Instalar herramientas de auditoría
        run: |
          npm install --no-save @lhci/cli playwright axe-core
          npx playwright install chromium

      - name: Iniciar servidor local para las auditorías
        run: |
          mkdir -p informes-auditoria
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/inconformistas-http.log 2>&1 &
          echo $! > /tmp/inconformistas-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              echo "Servidor local preparado."
              exit 0
            fi
            sleep 1
          done
          echo "No se pudo iniciar el servidor local."
          cat /tmp/inconformistas-http.log
          exit 1

      - name: Ejecutar auditoría Lighthouse (los resultados son informativos)
        continue-on-error: true
        run: npx lhci autorun

      - name: Ejecutar auditoría de accesibilidad axe en las ocho páginas
        run: node scripts/auditar-accesibilidad.js

      - name: Detener servidor local
        if: always()
        run: |
          if [ -f /tmp/inconformistas-http.pid ]; then
            kill "$(cat /tmp/inconformistas-http.pid)" 2>/dev/null || true
          fi

      - name: Guardar informes de auditoría aunque haya errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-auditoria-inconformistas
          path: informes-auditoria/
          if-no-files-found: warn
          retention-days: 7

      - name: Resumen de auditorías
        if: always()
        run: |
          {
            echo "## Auditorías de calidad"
            echo "Lighthouse: informes por página en informes-auditoria/lighthouse. Sus recomendaciones se registran como informativas y no bloquean axe."
            echo "axe: incidencias WCAG y errores JavaScript en informes-auditoria/accesibilidad-axe.json. Las incidencias graves/críticas y los errores JavaScript sí hacen fallar la auditoría."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar paquete de vista previa para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inconformistasfm-vista-previa
          path: |
            **
            !.git/**
            !.github/**
            !node_modules/**
          if-no-files-found: error
          retention-days: 7

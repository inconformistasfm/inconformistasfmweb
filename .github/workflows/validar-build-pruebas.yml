name: Validar build de Inconformistas FM

on:
  push:
    branches:
      - pruebas/accesibilidad-seo-rendimiento
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar páginas y recursos
        run: node generar-galeria.js
      - name: Comprobar páginas independientes
        run: |
          for page in index.html programas.html noticias.html equipo.html galeria.html artistas.html radio-online.html contacto.html; do
            test -s "$page"
            grep -q '<main id="main">' "$page"
          done
          test -s assets/generated/css
          test -s assets/generated/js
          test -s assets/generated/images
      - name: Comprobar sintaxis JavaScript generado
        run: |
          find assets/generated/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Resumen de tamaño
        run: |
          echo "HTML total:"
          wc -c index.html programas.html noticias.html equipo.html galeria.html artistas.html radio-online.html contacto.html
          echo "Recursos compartidos:"
          du -sh assets/generated

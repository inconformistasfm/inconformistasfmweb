name: Validar build de Inconformistas FM (solo pruebas)

on:
  push:
    branches:
      - pruebas/accesibilidad-seo-rendimiento

permissions:
  contents: read

concurrency:
  group: validar-inconformistas-pruebas
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/pruebas/accesibilidad-seo-rendimiento'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar exclusivamente la rama de pruebas
        uses: actions/checkout@v4
        with:
          ref: refs/heads/pruebas/accesibilidad-seo-rendimiento
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas y recursos
        run: node generar-galeria.js

      - name: Validar SEO, accesibilidad básica, rutas y recursos
        run: node scripts/verificar-build.js

      - name: Comprobar sintaxis de todo el JavaScript generado
        run: |
          find assets/generated/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Resumen de tamaños
        run: |
          echo "Tamaño de las páginas HTML generadas:"
          wc -c index.html programas.html noticias.html equipo.html galeria.html artistas.html radio-online.html contacto.html
          echo "Tamaño total de recursos generados:"
          du -sh assets/generated

      - name: Preparar paquete de vista previa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: inconformistasfm-vista-previa
          path: |
            **
            !.git/**
            !.github/**
          if-no-files-found: error
          retention-days: 7
